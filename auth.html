<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Nikahin</title>
  <link rel="stylesheet" href="./src/css/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Nikahin</h1>
      <p class="sub">Buat undangan pernikahan digitalmu</p>
      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Masuk</button>
        <button type="button" id="tabRegister">Daftar</button>
      </div>
      <form id="loginForm">
        <label>Email
          <input type="email" id="loginEmail" placeholder="nama@email.com" required autocomplete="email">
        </label>
        <label>Kata sandi
          <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit">Masuk</button>
      </form>
      <form id="registerForm" style="display:none">
        <label>Email
          <input type="email" id="regEmail" placeholder="nama@email.com" required autocomplete="email">
        </label>
        <label>Kata sandi <span style="font-size:12px">(min. 6 karakter)</span>
          <input type="password" id="regPassword" placeholder="••••••••" required autocomplete="new-password">
        </label>
        <label>Ulangi kata sandi
          <input type="password" id="regConfirm" placeholder="••••••••" required autocomplete="new-password">
        </label>
        <button type="submit">Daftar</button>
      </form>
      <p class="err" id="err"></p>
      <p class="swap"><a href="./">← Kembali ke beranda</a></p>
    </div>
  </div>
  <script type="module" src="./src/js/auth-ui.js"></script>
</body>
</html>
