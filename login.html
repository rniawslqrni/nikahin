<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Nikahin</title>
  <link rel="stylesheet" href="./src/css/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Nikahin</h1>
      <p class="sub">Masuk untuk mengelola undanganmu</p>
      <form id="loginForm">
        <label>Email
          <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
        </label>
        <label>Kata sandi
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <p class="err" id="err"></p>
        <button type="submit">Masuk</button>
      </form>
      <p class="swap">Belum punya akun? <a href="./register.html">Daftar di sini</a></p>
      <p class="swap"><a href="./index.html">← Kembali ke undangan</a></p>
    </div>
  </div>
  <script type="module" src="./src/js/auth-ui.js"></script>
</body>
</html>
